<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeckWright Player</title>
<style>
  :root{--bg:#f4f3ef;--card:#fff;--ink:#1c1c1f;--muted:#6b6b73;--line:#e3e1db;--accent:#1f6feb;--warn:#b45309;--err:#c0262d;--ok:#1a7f4b}
  @media (prefers-color-scheme:dark){:root{--bg:#111114;--card:#1a1a1f;--ink:#ececf0;--muted:#9a9aa5;--line:#2a2a31;--accent:#4c9bff;--warn:#f0a948;--err:#ff6b6b;--ok:#3ddc97}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  main{max-width:760px;margin:0 auto;padding:56px 20px 40px}
  h1{font-size:30px;margin:0 0 6px;letter-spacing:-.5px}
  .sub{color:var(--muted);margin:0 0 28px}
  #drop{border:2px dashed var(--line);border-radius:18px;background:var(--card);padding:44px 24px;text-align:center;transition:border-color .2s,background .2s}
  #drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
  #drop p{margin:6px 0;color:var(--muted)}
  #drop strong{color:var(--ink);font-size:19px}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--line);color:var(--ink)}
  button.primary{background:var(--accent);color:#fff;font-weight:700}
  button:disabled{opacity:.5;cursor:default}
  #info{display:none;margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
  #info h2{margin:0 0 4px;font-size:22px}
  #meta{color:var(--muted);margin:0 0 14px;font-size:14px}
  #issues{list-style:none;padding:0;margin:0 0 18px;font-size:14px;max-height:220px;overflow:auto}
  #issues li{padding:4px 0;border-bottom:1px solid var(--line)}
  #issues li.warn{color:var(--warn)}#issues li.error{color:var(--err)}#issues li.info{color:var(--muted)}
  #issues li.ok{color:var(--ok)}
  .tips{margin-top:28px;color:var(--muted);font-size:14px}
  .tips kbd{font:12px ui-monospace,Menlo,Consolas,monospace;padding:1px 6px;border:1px solid var(--line);border-radius:5px;background:var(--card)}
  .tips li{margin:3px 0}
  #err{color:var(--err);margin-top:14px;display:none}
  input[type=file]{display:none}
</style>
</head>
<body>
<main>
  <h1>DeckWright Player</h1>
  <p class="sub" data-en="Present AI-made HTML decks like PowerPoint. No install, no internet needed.">AI가 만든 HTML 발표 파일을 PPT처럼 발표합니다. 설치도, 인터넷도 필요 없습니다.</p>
  <div id="drop">
    <strong data-en="Drop a file or folder here">여기에 파일을 끌어다 놓으세요</strong>
    <p data-en=".hdek package · .html file · a folder with a deck">.hdek 패키지 · .html 파일 · 덱이 들어 있는 폴더</p>
    <div class="btns">
      <button id="pickFile" class="primary" data-en="Open file">파일 열기</button>
      <button id="pickDir" data-en="Open folder">폴더 열기</button>
    </div>
    <input id="file" type="file" accept=".hdek,.zip,.html,.htm">
    <input id="dir" type="file" webkitdirectory multiple>
  </div>
  <div id="err"></div>
  <section id="info">
    <h2 id="title"></h2>
    <p id="meta"></p>
    <ul id="issues"></ul>
    <div class="btns" style="justify-content:flex-start">
      <button id="start" class="primary" data-en="Start presenting">발표 시작</button>
      <button id="save" data-en="Save as single HTML">단독 HTML로 저장</button>
    </div>
  </section>
  <ul class="tips">
    <li data-en="While presenting: <kbd>S</kbd> presenter view (notes · next slide · timer), <kbd>F</kbd> fullscreen/projector, <kbd>B</kbd> black screen, <kbd>D</kbd> pen, <kbd>?</kbd> all shortcuts">발표 중 <kbd>S</kbd> 발표자 창(노트·다음 슬라이드·타이머), <kbd>F</kbd> 전체화면/프로젝터, <kbd>B</kbd> 검은 화면, <kbd>D</kbd> 펜, <kbd>?</kbd> 전체 단축키</li>
    <li data-en="Reload to come back to this page.">이 페이지로 돌아오려면 새로고침하세요.</li>
  </ul>
</main>

  async function onDrop(dt) {

    var entries = items.map(function (it) { return it.webkitGetAsEntry ? it.webkitGetAsEntry() : null; }).filter(Boolean);
    if (entries.length === 1 && entries[0].isDirectory) {
      var map = Object.create(null);
      var reader = entries[0].createReader(), batch;
      do {
        batch = await new Promise(function (res, rej) { reader.readEntries(res, rej); });
        for (var i = 0; i < batch.length; i++) await readEntry(batch[i], '', map);
      } while (batch.length);
      return fromFiles(map, entries[0].name);
    }
    if (dt.files && dt.files.length) return openFile(dt.files[0]);
    throw new Error(T('파일을 읽지 못했습니다', 'Could not read the file'));
  }

  function showInfo(res) {
    current = res;
    var info = res.lint.info;
    $('info').style.display = 'block';
    $('title').textContent = info.title || res.name;
    var kb = res.html.length > 1048576 ? (res.html.length / 1048576).toFixed(1) + ' MB' : Math.round(res.html.length / 1024) + ' KB';
    $('meta').textContent = (info.contract ? T('DeckWright 규약 · ', 'DeckWright contract · ') : T('규약 없음(자동 인식) · ', 'No contract (auto-detect) · ')) + (info.slides.length ? T('슬라이드 ' + info.slides.length + '개 · ', info.slides.length + ' slides · ') : (info.guess ? T('슬라이드 약 ' + info.guess + '개 · ', '~' + info.guess + ' slides · ') : '')) + (info.staged ? info.width + '×' + info.height + ' · ' : '') + kb;
    var ul = $('issues'); ul.innerHTML = '';
    var issues = res.lint.issues.filter(function (x) { return x.level !== 'info' || res.lint.issues.length < 12; });
    if (!issues.length) issues = [{ level: 'ok', msg: T('문제 없음 — 오프라인에서도 그대로 발표할 수 있습니다', 'No problems — ready to present offline') }];
    issues.forEach(function (it) { var li = document.createElement('li'); li.className = it.level; li.textContent = (it.level === 'error' ? '✗ ' : it.level === 'warn' ? '! ' : it.level === 'ok' ? '✓ ' : '· ') + it.msg; ul.appendChild(li); });
    $('start').focus();
  }

  function present() {
    if (!current) return;
    var html = current.html;
    window.__HDEK_SRCDOC__ = html;
    document.open();
    document.write(html);
    document.close();
  }

  async function saveSingle() {
    if (!current) return;
    var html = current.html;
    if (current.blobs) {
      // large assets were kept as blob URLs for presenting; a saved file needs them inline
      try {
        var map = current.map;
        var r = await Core.inlineHTML(current.source, { path: current.entry, read: function (p) { return Core.own(map, p) || null; } });
        html = Core.injectRuntime(r.html, RUNTIME);
      } catch (e) {
        alert(T('자원이 너무 커서 HTML 한 개로 저장할 수 없습니다. 명령줄 도구로 .hdek 패키지를 만드세요(deckwright pack).', 'The assets are too large for one HTML file. Make a .hdek package with the command-line tool (deckwright pack).'));
        return;
      }
    }
    var info = current.lint.info;
    var manifest = Core.buildManifest({ title: info.title || current.name, entry: 'index.html', width: info.width, height: info.height, staged: info.staged, duration: info.duration, slides: info.slides });
    html = Core.injectRuntime(html, RUNTIME, '<script type="application/hdek+json" id="hdek-manifest">' + JSON.stringify(manifest).replace(/</g, '\\u003c') + '<\/script>');
    var url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = (current.name || 'deck') + '_single.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  function run(p) {
    // a new load replaces the old one, even when it fails
    current = null; showErr(''); $('info').style.display = 'none';
    p.then(showInfo).catch(function (e) { console.error(e); current = null; showErr(e.message || String(e)); });
  }

  $('pickFile').onclick = function () { $('file').click(); };
  $('pickDir').onclick = function () { $('dir').click(); };
  // reset the input so choosing the same file again still loads it
  $('file').onchange = function (e) { var l = e.target.files; if (l.length) run(openFileList(l).finally(function () { e.target.value = ''; })); };
  $('dir').onchange = function (e) { var l = e.target.files; if (l.length) run(openFileList(l).finally(function () { e.target.value = ''; })); };
  $('start').onclick = present;
  $('save').onclick = function () { saveSingle().catch(function (e) { showErr(e.message || String(e)); }); };
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); if (t === 'dragleave' && e.relatedTarget) return; drop.classList.remove('over'); }); });
  document.addEventListener('drop', function (e) { run(onDrop(e.dataTransfer)); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && current && document.activeElement !== $('save')) present(); });

  // for tests and automation
  window.DeckWrightPlayer = window.HDeckPlayer = { openBytes: function (name, bytes) { return openFile(new File([bytes], name)).then(showInfo); }, present: present };
})();
</script>
</body>
</html>
